<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Life Coffee Slow Bar</title>

<link rel="stylesheet" href="css/style.css">

</head>


<body>


<header class="hero">

<div class="hero-content">


<div class="logo-box">

<h1>
LIFE COFFEE
</h1>

</div>



<h3>
SLOW BAR
</h3>



<p>
Luang Prabang
information:2092747227
</p>


</div>

</header>






<section id="menu">


<h2>
OUR MENU
</h2>



<div class="categories">


<button onclick="showCategory('coffee')">
Coffee
</button>



<button onclick="showCategory('matcha')">
Matcha
</button>



<button onclick="showCategory('noncoffee')">
Non Coffee
</button>


</div>




<div id="coffee-menu" class="menu-container">

</div>



</section>









<!-- MOBILE CART BUTTON -->


<button class="mobile-cart-btn" onclick="openMobileCart()">

🛒

</button>








<!-- CART -->


<div class="cart" id="cart">


<h2>
Your Order
</h2>



<p>

Order :

<b id="order-number">

</b>

</p>




<div id="cart-items">

Your cart is empty

</div>




<h3>

Total :

<span id="cart-total">
0
</span>

Kip

</h3>




<button onclick="openCustomer()">

ORDER

</button>



</div>









<!-- SUGAR POPUP -->


<div id="sugar-popup" class="popup">


<div class="popup-box">


<h2>
Sugar
</h2>



<select id="sugar">


<option>
Normal sugar
</option>


<option>
Less sugar
</option>


<option>
No sugar
</option>


<option>
Extra sugar
</option>


</select>




<br>


<button onclick="addSugar()">

ADD TO CART

</button>


</div>


</div>









<!-- CUSTOMER POPUP -->


<div id="customer-popup" class="popup">


<div class="popup-box">


<h2>
Customer Name
</h2>



<input id="customer" placeholder="Name">



<br>



<button onclick="openPayment()">

NEXT

</button>



</div>

</div>









<!-- PAYMENT POPUP -->


<div id="payment-popup" class="popup">


<div class="popup-box">


<h2>
Payment
</h2>




<label>

<input type="radio" name="pay" value="Cash" checked>

Cash

</label>




<br>




<label>

<input type="radio" name="pay" value="BCEL QR">

BCEL QR

</label>




<br><br>



<button onclick="sendOrder()">

CONFIRM

</button>



</div>


</div>









<!-- LOCATION -->


<section class="location">


<h2>
LOCATION
</h2>



<p>

Life Coffee Slow Bar<br>

Luang Prabang, Laos

</p>





<div class="map">


<iframe

src="https://www.google.com/maps?q=19.893580509785366, 102.13925794767623&output=embed"

width="100%"

height="300"

style="border:0;"

allowfullscreen=""

loading="lazy">

</iframe>


</div>





<a

href="https://www.google.com/maps?q=19.893683684389714,102.1394086714891"

target="_blank">

OPEN GOOGLE MAPS

</a>



</section>









<script src="js/menu.js"></script>

<script src="js/app.js"></script>



</body>

</html>
