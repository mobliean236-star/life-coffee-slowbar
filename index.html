<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Life Coffee Slow Bar</title>

<link rel="stylesheet" href="css/style.css">

</head>


<body>


<header class="hero">

<div class="hero-content">

<h1>LIFE COFFEE</h1>

<h3>SLOW BAR</h3>

<p>Specialty Coffee • Luang Prabang</p>

<a href="#menu">
VIEW MENU
</a>

</div>

</header>





<section id="menu">

<h2>
Our Menu ☕
</h2>


<div id="coffee-menu" class="menu-container">

</div>


</section>





<!-- CART -->

<section class="floating-cart">


<h2>
🛒 Your Order
</h2>


<p>
Order:
<b id="order-number">
ODR001
</b>
</p>


<div id="cart-items">

<p>Your cart is empty</p>

</div>



<h3>

Total:
<span id="cart-total">
0
</span>
Kip

</h3>



<button onclick="openCustomerPopup()">

ORDER

</button>


</section>







<!-- SUGAR POPUP -->

<div id="sugar-popup" class="popup">


<div class="popup-box">


<h2 id="sugar-title">
Sugar
</h2>


<select id="sugar-choice">

<option>Normal sugar</option>

<option>Less sugar</option>

<option>No sugar</option>

<option>Extra sugar</option>

</select>


<button onclick="confirmSugar()">
ADD TO CART
</button>


</div>


</div>







<!-- CUSTOMER POPUP -->

<div id="customer-popup" class="popup">


<div class="popup-box">


<h2>
Customer Name
</h2>


<input 
id="customer-name"
placeholder="Your name">


<button onclick="openPaymentPopup()">

CONTINUE

</button>


</div>


</div>







<!-- PAYMENT POPUP -->

<div id="payment-popup" class="popup">


<div class="popup-box">


<h2>
Payment Method
</h2>


<label>
<input type="radio" name="payment" value="Cash" checked>
Cash 💵
</label>


<br>


<label>
<input type="radio" name="payment" value="BCEL QR">
BCEL QR 📱
</label>


<br><br>


<button onclick="sendWhatsApp()">

CONFIRM ORDER

</button>


</div>


</div>







<script src="js/menu.js"></script>

<script src="js/app.js"></script>


</body>

</html>
