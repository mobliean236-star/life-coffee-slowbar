<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Life Coffee Slow Bar</title>

<link rel="stylesheet" href="css/style.css">

</head>


<body>


<header class="hero">

<div class="overlay"></div>

<div class="hero-content">

<h1>LIFE COFFEE</h1>

<h3>SLOW BAR</h3>

<p>Specialty Coffee • Luang Prabang</p>

<a href="#menu">
VIEW MENU
</a>

</div>

</header>





<section id="menu">

<h2>
Our Coffee Menu ☕
</h2>


<div id="coffee-menu" class="menu-container">

</div>


</section>






<section class="order-info">


<h2>
Customer Information
</h2>


<label>
Name:
</label>


<input 
type="text" 
id="customer-name"
placeholder="Your name">



<h3>
Payment Method 💳
</h3>


<label>
<input type="radio" name="payment" value="Cash" checked>
Cash 💵
</label>


<br>


<label>
<input type="radio" name="payment" value="BCEL QR">
BCEL QR 📱
</label>



</section>







<section class="cart">


<h2>
Your Order 🛒
</h2>


<p>
Order Number:
<b id="order-number">
ODR001
</b>
</p>



<div id="cart-items">

<p>
Your cart is empty
</p>

</div>



<h3>

Total:
<span id="cart-total">
0
</span>
Kip

</h3>



<button onclick="sendWhatsApp()">

Order on WhatsApp 📱

</button>



</section>







<footer>

<p>
© 2026 Life Coffee Slow Bar
</p>

</footer>






<script src="js/menu.js"></script>

<script src="js/app.js"></script>


</body>

</html>
